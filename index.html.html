<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bot Schedule</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --bg: #0a0d10;
    --bg-grid: #10151a;
    --surface: #12171c;
    --surface-2: #171d23;
    --hair: #232b32;
    --text: #eef2f4;
    --text-dim: #7c8994;
    --text-faint: #4a555f;
    --accent: #4fd1c5;
    --accent-dim: #234845;
    --warn: #f5a623;
    --done: #5b6470;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 15% 0%, var(--bg-grid) 0%, var(--bg) 55%),
      var(--bg);
    color: var(--text);
    font-family: 'Sora', ui-sans-serif, system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-inline: clamp(16px, 4vw, 64px);
    padding-block: clamp(20px, 3.5vh, 48px);
  }

  .frame{
    width: 100%;
    max-width: 1500px;
    display: flex;
    flex-direction: column;
    gap: clamp(14px, 2.6vh, 30px);
    flex: 1;
    justify-content: center;
  }

  header{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px 24px;
    border-bottom: 1px solid var(--hair);
    padding-bottom: clamp(12px, 2vh, 20px);
  }

  .eyebrow{
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: clamp(0.72rem, 1vw, 0.95rem);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
  }

  h1{
    margin: 4px 0 0;
    font-size: clamp(1.6rem, 3.2vw, 2.6rem);
    font-weight: 700;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }

  .clock{
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
    color: var(--text-dim);
    font-size: clamp(0.85rem, 1.4vw, 1.15rem);
    text-align: right;
    line-height: 1.5;
  }
  .clock .today-label{ color: var(--text-faint); letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.78em; }

  .quote{
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 4px 10px;
    border-left: 3px solid var(--accent);
    padding-left: clamp(12px, 2vw, 18px);
    font-style: italic;
    font-weight: 600;
    color: var(--text-dim);
    font-size: clamp(1rem, 1.8vw, 1.35rem);
    letter-spacing: -0.01em;
  }
  .quote-tag{
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-style: normal;
    font-weight: 500;
    font-size: 0.6em;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-faint);
    white-space: nowrap;
  }

  .rows{
    display: flex;
    flex-direction: column;
    gap: clamp(8px, 1.3vh, 14px);
  }

  .row{
    position: relative;
    display: grid;
    grid-template-columns: clamp(100px, 9vw, 150px) 1fr auto;
    align-items: center;
    gap: clamp(14px, 2.6vw, 36px);
    background: var(--surface);
    border: 1px solid var(--hair);
    border-radius: 14px;
    padding: clamp(12px, 2vh, 22px) clamp(18px, 2.6vw, 34px);
    overflow: hidden;
  }
  .row::before{
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: var(--hair);
  }
  .row[data-status="today"]{ background: var(--surface-2); border-color: #3a3226; }
  .row[data-status="today"]::before{ background: var(--warn); }
  .row[data-status="done"]::before{ background: var(--done); }
  .row[data-status="upcoming"]::before{ background: var(--accent-dim); }

  .when{
    display: flex;
    align-items: baseline;
    gap: 10px;
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
  }
  .dnum{
    font-size: clamp(2rem, 4.2vw, 3.2rem);
    font-weight: 500;
    line-height: 1;
    color: var(--text-faint);
  }
  .dmeta{
    display: flex;
    flex-direction: column;
    gap: 2px;
    font-size: clamp(0.7rem, 1vw, 0.9rem);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    line-height: 1.2;
  }
  .row[data-status="today"] .dnum{ color: var(--warn); }
  .row[data-status="upcoming"] .dnum{ color: var(--accent); }

  .items{
    display: flex;
    flex-wrap: wrap;
    gap: 6px clamp(20px, 3vw, 44px);
    min-width: 0;
  }
  .item{
    display: inline-flex;
    align-items: center;
    gap: 0.6em;
    font-size: clamp(1.1rem, 2.2vw, 1.8rem);
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--text);
  }
  .item::before{
    content: "";
    width: 0.32em;
    height: 0.32em;
    border-radius: 1px;
    background: var(--accent);
    flex: none;
  }
  .row[data-status="today"] .item::before{ background: var(--warn); }
  .row[data-status="done"] .item{ color: var(--text-dim); }
  .row[data-status="done"] .item::before{ background: var(--done); }

  .badge{
    justify-self: end;
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: clamp(0.72rem, 1vw, 0.9rem);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.5em 0.9em;
    border-radius: 999px;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 0.5em;
  }
  .badge::before{
    content: "";
    width: 0.5em;
    height: 0.5em;
    border-radius: 50%;
    background: currentColor;
    flex: none;
  }
  .row[data-status="done"] .badge{ background: rgba(91,100,112,0.14); color: var(--done); }
  .row[data-status="today"] .badge{ background: rgba(245,166,35,0.14); color: var(--warn); }
  .row[data-status="today"] .badge::before{ animation: pulse 1.8s ease-in-out infinite; }
  .row[data-status="upcoming"] .badge{ background: rgba(79,209,197,0.12); color: var(--accent); }

  @keyframes pulse{
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(1.25); }
  }
  @media (prefers-reduced-motion: reduce){
    .row[data-status="today"] .badge::before{ animation: none; }
  }

  footer{
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px 20px;
    color: var(--text-faint);
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: clamp(0.7rem, 0.95vw, 0.85rem);
    letter-spacing: 0.05em;
  }

  @media (max-width: 700px){
    .row{ grid-template-columns: 1fr; gap: 10px; }
    .badge{ justify-self: start; }
  }
</style>
</head>
<body>
<div class="frame">
  <header>
    <div>
      <div class="eyebrow">Acciorobotics</div>
      <h1>Bot Schedule</h1>
    </div>
    <div class="clock">
      <div class="today-label">Today</div>
      <div id="clock-date">&mdash;</div>
    </div>
  </header>

  <div class="quote">&ldquo;Get shit done.&rdquo; <span class="quote-tag">Acciorobotics</span></div>

  <div class="rows" id="rows"></div>

  <footer>
    <span id="summary">&nbsp;</span>
    <span id="count">&nbsp;</span>
  </footer>
</div>

<script>
  // To change the schedule, edit this list: [ "YYYY-MM-DD", "Item name" ].
  // Items on the same date are grouped into one row automatically.
  const SCHEDULE = [
    ["2026-10-12", "BOT 11 PACB Wiring"],
    ["2026-10-12", "BOT 9 Child Chassis"],
    ["2026-10-16", "BOT 11 Child"],
    ["2026-10-16", "BOT PA"],
    ["2026-10-19", "BOT 12 Mother"],
    ["2026-10-20", "BOT 12 PA Control Box"],
    ["2026-10-20", "BOT 12 CDCB"],
    ["2026-10-23", "BOT 12 Child"],
    ["2026-10-28", "Spare 4 Mother and Child"],
    ["2026-10-28", "BOT 12 PA"],
  ];

  const rowsEl = document.getElementById('rows');
  const clockEl = document.getElementById('clock-date');
  const summaryEl = document.getElementById('summary');
  const countEl = document.getElementById('count');

  const FULL_FMT = new Intl.DateTimeFormat('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
  const MONTH_FMT = new Intl.DateTimeFormat('en-GB', { month: 'short' });
  const WEEKDAY_FMT = new Intl.DateTimeFormat('en-GB', { weekday: 'short' });
  const SHORT_FMT = new Intl.DateTimeFormat('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });

  function esc(s){
    return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }

  function startOfDay(d){
    const nd = new Date(d);
    nd.setHours(0,0,0,0);
    return nd;
  }

  function dayDiff(a, b){
    return Math.round((startOfDay(a) - startOfDay(b)) / 86400000);
  }

  function groupByDate(list){
    const map = new Map();
    list.forEach(([date, name]) => {
      if (!map.has(date)) map.set(date, []);
      map.get(date).push(name);
    });
    return [...map.entries()]
      .sort((a, b) => a[0].localeCompare(b[0]))
      .map(([date, items]) => ({ date, items }));
  }

  function render(){
    const now = new Date();
    clockEl.textContent = FULL_FMT.format(now);

    const groups = groupByDate(SCHEDULE);
    rowsEl.innerHTML = '';
    let next = null;
    let pastCount = 0;

    groups.forEach(g => {
      const d = new Date(g.date + 'T00:00:00');
      const diff = dayDiff(d, now);
      let status, badgeText;

      if (diff === 0){
        status = 'today';
        badgeText = 'Due today';
      } else if (diff < 0){
        status = 'done';
        pastCount += g.items.length;
        badgeText = Math.abs(diff) === 1 ? 'Yesterday' : `${Math.abs(diff)} days ago`;
      } else {
        status = 'upcoming';
        badgeText = diff === 1 ? 'Tomorrow' : `In ${diff} days`;
        if (next === null) next = { d, count: g.items.length };
      }

      const row = document.createElement('div');
      row.className = 'row';
      row.setAttribute('data-status', status);
      row.innerHTML = `
        <div class="when">
          <div class="dnum">${String(d.getDate()).padStart(2, '0')}</div>
          <div class="dmeta"><span>${MONTH_FMT.format(d)}</span><span>${WEEKDAY_FMT.format(d)}</span></div>
        </div>
        <div class="items">${g.items.map(n => `<span class="item">${esc(n)}</span>`).join('')}</div>
        <div class="badge">${badgeText}</div>
      `;
      rowsEl.appendChild(row);
    });

    summaryEl.textContent = next
      ? `Next up: ${SHORT_FMT.format(next.d)} · ${next.count} ${next.count === 1 ? 'item' : 'items'}`
      : 'Everything on the schedule has passed';
    countEl.textContent = `${pastCount} of ${SCHEDULE.length} items past · updates automatically`;
  }

  render();
  // Re-check every minute so "today" and day counts stay correct if the page is left open on the TV.
  setInterval(render, 60 * 1000);
</script>
</body>
</html>
