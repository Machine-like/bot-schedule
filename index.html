<title>Bot Deployment Schedule</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --bg: #0a0d10;
    --bg-grid: #10151a;
    --surface: #12171c;
    --surface-2: #171d23;
    --hair: #232b32;
    --text: #eef2f4;
    --text-dim: #7c8994;
    --text-faint: #4a555f;
    --accent: #4fd1c5;
    --accent-dim: #234845;
    --warn: #f5a623;
    --warn-dim: #4a3a1a;
    --done: #5b6470;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 15% 0%, var(--bg-grid) 0%, var(--bg) 55%),
      var(--bg);
    color: var(--text);
    font-family: 'Sora', ui-sans-serif, system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(20px, 4vw, 56px) clamp(16px, 5vw, 64px);
    padding-block: clamp(28px, 5vh, 64px);
  }

  .frame{
    width: 100%;
    max-width: 1180px;
    display: flex;
    flex-direction: column;
    gap: clamp(20px, 3.5vh, 40px);
    flex: 1;
    justify-content: center;
  }

  header{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px 24px;
    border-bottom: 1px solid var(--hair);
    padding-bottom: clamp(14px, 2.2vh, 22px);
  }

  .eyebrow{
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: clamp(0.72rem, 1vw, 0.95rem);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
  }

  h1{
    margin: 4px 0 0;
    font-size: clamp(1.6rem, 3.4vw, 2.6rem);
    font-weight: 700;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }

  .clock{
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
    color: var(--text-dim);
    font-size: clamp(0.85rem, 1.4vw, 1.1rem);
    text-align: right;
    line-height: 1.5;
  }
  .clock .today-label{ color: var(--text-faint); letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.78em; }

  .rows{
    display: flex;
    flex-direction: column;
    gap: clamp(10px, 1.6vh, 16px);
  }

  .row{
    position: relative;
    display: grid;
    grid-template-columns: clamp(70px, 8vw, 110px) 1fr auto;
    align-items: center;
    gap: clamp(14px, 3vw, 36px);
    background: var(--surface);
    border: 1px solid var(--hair);
    border-radius: 14px;
    padding: clamp(18px, 3vh, 30px) clamp(20px, 3vw, 34px);
    overflow: hidden;
  }
  .row::before{
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: var(--hair);
  }
  .row[data-status="today"]{ background: var(--surface-2); border-color: #3a3226; }
  .row[data-status="today"]::before{ background: var(--warn); }
  .row[data-status="done"]::before{ background: var(--done); }
  .row[data-status="upcoming"]::before{ background: var(--accent-dim); }

  .idx{
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: clamp(1.8rem, 4.2vw, 3.1rem);
    font-weight: 500;
    color: var(--text-faint);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .row[data-status="today"] .idx{ color: var(--warn); }
  .row[data-status="upcoming"] .idx{ color: var(--accent); }

  .label-block{ min-width: 0; }
  .label{
    font-size: clamp(1.3rem, 2.6vw, 1.9rem);
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .sublabel{
    margin-top: 4px;
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: clamp(0.78rem, 1.1vw, 0.95rem);
    color: var(--text-dim);
    letter-spacing: 0.04em;
  }

  .meta{
    display: flex;
    align-items: center;
    gap: clamp(14px, 2.6vw, 30px);
    justify-self: end;
  }

  .date{
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
    font-size: clamp(1.05rem, 2vw, 1.55rem);
    color: var(--text);
    text-align: right;
    white-space: nowrap;
  }

  .badge{
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: clamp(0.72rem, 1vw, 0.88rem);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.5em 0.9em;
    border-radius: 999px;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 0.5em;
  }
  .badge::before{
    content: "";
    width: 0.5em;
    height: 0.5em;
    border-radius: 50%;
    background: currentColor;
    flex: none;
  }
  .row[data-status="done"] .badge{ background: rgba(91,100,112,0.14); color: var(--done); }
  .row[data-status="today"] .badge{ background: rgba(245,166,35,0.14); color: var(--warn); }
  .row[data-status="today"] .badge::before{ animation: pulse 1.8s ease-in-out infinite; }
  .row[data-status="upcoming"] .badge{ background: rgba(79,209,197,0.12); color: var(--accent); }

  @keyframes pulse{
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.45; transform: scale(1.25); }
  }
  @media (prefers-reduced-motion: reduce){
    .row[data-status="today"] .badge::before{ animation: none; }
  }

  footer{
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px 20px;
    color: var(--text-faint);
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: clamp(0.7rem, 0.95vw, 0.85rem);
    letter-spacing: 0.05em;
    padding-top: clamp(6px, 1.2vh, 12px);
  }

  @media (max-width: 640px){
    .row{ grid-template-columns: 56px 1fr; }
    .meta{ grid-column: 1 / -1; justify-self: start; padding-left: calc(56px + clamp(14px,3vw,36px)); flex-wrap: wrap; }
  }
</style>

<div class="frame">
  <header>
    <div>
      <div class="eyebrow">Acciorobotics &middot; Fleet Ops</div>
      <h1>Bot Deployment Schedule</h1>
    </div>
    <div class="clock">
      <div class="today-label">Today</div>
      <div id="clock-date">&mdash;</div>
    </div>
  </header>

  <div class="rows" id="rows"></div>

  <footer>
    <span id="summary">&nbsp;</span>
    <span>Updated live &middot; refreshes at midnight</span>
  </footer>
</div>

<script>
  const SCHEDULE = [
    { name: "BOT 8",  date: "2026-09-11" },
    { name: "BOT 9",  date: "2026-09-25" },
    { name: "BOT 10", date: "2026-09-30" },
  ];

  const rowsEl = document.getElementById('rows');
  const clockEl = document.getElementById('clock-date');
  const summaryEl = document.getElementById('summary');

  const DAY_FMT = new Intl.DateTimeFormat('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });

  function startOfDay(d){
    const nd = new Date(d);
    nd.setHours(0,0,0,0);
    return nd;
  }

  function dayDiff(a, b){
    return Math.round((startOfDay(a) - startOfDay(b)) / 86400000);
  }

  function render(){
    const now = new Date();
    clockEl.textContent = DAY_FMT.format(now);

    rowsEl.innerHTML = '';
    let nextUpcoming = null;

    SCHEDULE.forEach((item, i) => {
      const d = new Date(item.date + 'T00:00:00');
      const diff = dayDiff(d, now);
      let status, badgeText;

      if (diff === 0){
        status = 'today';
        badgeText = 'Today';
      } else if (diff < 0){
        status = 'done';
        badgeText = Math.abs(diff) === 1 ? 'Deployed yesterday' : `Deployed ${Math.abs(diff)}d ago`;
      } else {
        status = 'upcoming';
        badgeText = diff === 1 ? 'In 1 day' : `In ${diff} days`;
        if (nextUpcoming === null) nextUpcoming = item.name;
      }

      const row = document.createElement('div');
      row.className = 'row';
      row.setAttribute('data-status', status);
      row.innerHTML = `
        <div class="idx">${String(i + 1).padStart(2, '0')}</div>
        <div class="label-block">
          <div class="label">${item.name}</div>
          <div class="sublabel">Deployment window</div>
        </div>
        <div class="meta">
          <div class="date">${DAY_FMT.format(d)}</div>
          <div class="badge">${badgeText}</div>
        </div>
      `;
      rowsEl.appendChild(row);
    });

    summaryEl.textContent = nextUpcoming
      ? `Next up: ${nextUpcoming}`
      : 'All deployments complete';
  }

  render();
  // Re-render on the hour so "today"/day-count status stays correct if left projecting.
  setInterval(render, 60 * 1000);
</script>
